[project]
name = "bms-resource-scripts"
version = "0.1.0"
description = "BMS 资源打包脚本：解析、目录命名、媒体转换与大包生成"
requires-python = ">=3.12"
dependencies = [
    "py7zr>=1.0.0",
    "rarfile>=4.2",
    "openpyxl>=3.1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bms", "fs", "media", "options", "scripts"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "A",    # flake8-builtins
    "ANN",  # flake8-annotations
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "E",    # pycodestyle errors
    "EM",   # flake8-errmsg
    "F",    # pyflakes
    "FA",   # flake8-future-annotations
    "FLY",  # flynt
    "FURB", # refurb
    "G",    # flake8-logging-format
    "I",    # isort
    "ISC",  # flake8-implicit-str-concat
    "LOG",  # flake8-logging
    "N",    # pep8-naming
    "PERF", # perflint
    "PIE",  # flake8-pie
    "PL",   # pylint
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "RUF",  # ruff
    "SIM",  # flake8-simplify
    "SLF",  # flake8-self
    "T10",  # flake8-debugger
    "TID",  # flake8-tidy-imports
    "TRY",  # tryceratops
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    "E203",    # space before :（ruff format 的切片风格）
    # 中文文本中的全角标点会被判为“模棱两可的 Unicode 字符”，本仓库注释与
    # 提示文本大量使用中文标点，这三条规则不适用于本仓库。
    "RUF001",
    "RUF002",
    "RUF003",
]

# 豁免逐目录登记：结构性复杂度（长流程解压/同步/转换与交互菜单）
# 拆分风险大于收益，保持函数为完整流程。新增豁免必须在本表登记。
[tool.ruff.lint.per-file-ignores]
"fs/move.py" = ["PLR0911", "PLR0915"]
"fs/rawpack.py" = ["PLR0912", "PLR0915"]
"fs/sync.py" = ["PLR0912", "PLR0913", "PLR0915", "PLR0917"]
"media/audio.py" = ["PLR0912", "PLR0915"]
"media/video.py" = ["PLR0912", "PLR0913", "PLR0915", "PLR0917"]
"options/__init__.py" = ["ANN401", "PLR0912"]
"options/bms_events.py" = ["PLR0912"]
"options/bms_folder.py" = ["PLR0911"]
"options/bms_folder_bigpack.py" = ["PLR0912"]
"options/rawpack.py" = ["PLR0912"]
"bms/parse.py" = ["ANN401"]

[tool.ruff.lint.isort]
known-first-party = ["bms", "media", "options", "scripts"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.ty.environment]
python-version = "3.12"

[dependency-groups]
dev = [
    "ruff>=0.17.0",
    "ty>=0.0.86",
]
